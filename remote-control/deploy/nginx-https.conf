server {
    listen 80;
    listen [::]:80;
    server_name byd.slk-soft.ru;
    root /www/wwwroot/byd.slk-soft.ru;
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; try_files $uri =404; }
    location / { return 301 https://byd.slk-soft.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name byd.slk-soft.ru;
    ssl_certificate /www/server/panel/vhost/cert/byd.slk-soft.ru/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/byd.slk-soft.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18183;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
    }
    access_log /www/wwwlogs/byd.slk-soft.ru.log;
    error_log /www/wwwlogs/byd.slk-soft.ru.error.log;
}
