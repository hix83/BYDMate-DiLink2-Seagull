services:
  gateway:
    build: .
    container_name: bydmate-remote
    restart: unless-stopped
    ports:
      - "127.0.0.1:18183:8080"
    environment:
      PUBLIC_URL: https://byd.slk-soft.ru
      DATABASE: /data/bydmate.db
    volumes:
      - bydmate-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bydmate-data:
